<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Orçamento · Marcenaria Costa</title>

<meta property="og:type" content="website">
<meta property="og:title" content="Seu orçamento — Marcenaria Costa">
<meta property="og:description" content="Móveis planejados sob medida em Curitiba. Toque para ver os detalhes da proposta.">
<meta property="og:image" content="https://www.marcenariacosta.com.br/assets/img/og-image.jpg">

<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap">

<style>
:root{
  --ground:#f7f4ee;--surface:#fffdf9;--surface-2:#f1ece2;--line:#e2dbcc;
  --ink:#1b1812;--ink-2:#56503f;--ink-3:#8b8371;
  --latao:#8f6620;--latao-bg:#f3e7d0;--zap:#1faa54;--grave:#ad3a39;
}
@media(prefers-color-scheme:dark){
  :root{
    --ground:#14120d;--surface:#1e1b14;--surface-2:#27231a;--line:#383221;
    --ink:#f4efe3;--ink-2:#b7af9e;--ink-3:#837c6c;
    --latao:#d9ae5e;--latao-bg:#2f2717;--zap:#1faa54;--grave:#e07d7c;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
.folha{max-width:640px;margin:0 auto;padding:0 18px 56px}

.topo{padding:26px 0 20px;border-bottom:3px solid var(--latao);margin-bottom:22px}
.marca{font-family:Fraunces,Georgia,serif;font-size:1.55rem;font-weight:600;margin:0;letter-spacing:-.01em;line-height:0}
.marca img{width:100%;max-width:186px;height:auto}
@media(prefers-color-scheme:dark){.marca img{background:#f7f4ee;padding:9px 13px;border-radius:10px}}
.marca__sub{color:var(--ink-3);font-size:.82rem;margin:3px 0 0}
.selo{display:inline-block;margin-top:14px;background:var(--latao-bg);color:var(--latao);
  font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  padding:5px 11px;border-radius:6px}
.num-grande{font-family:Fraunces,Georgia,serif;font-size:1.9rem;font-weight:600;margin:8px 0 0;line-height:1.1}
.data{color:var(--ink-3);font-size:.85rem;margin:2px 0 0}

.para{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:24px}
.para__rot{font-size:.7rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 5px}
.para__nome{font-family:Fraunces,Georgia,serif;font-size:1.2rem;font-weight:600;margin:0}
.para__dados{color:var(--ink-2);font-size:.87rem;margin:5px 0 0}

h2.secao{font-family:Inter,sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 12px}

.movel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 17px;margin-bottom:10px}
.movel__nome{font-family:Fraunces,Georgia,serif;font-size:1.13rem;font-weight:600;margin:0;line-height:1.3}
.movel__det{color:var(--ink-2);font-size:.9rem;margin:7px 0 0;white-space:pre-wrap}
.movel__conta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  margin-top:13px;padding-top:12px;border-top:1px dashed var(--line)}
.movel__calc{color:var(--ink-3);font-size:.85rem;font-variant-numeric:tabular-nums}
.movel__total{font-size:1.08rem;font-weight:600;font-variant-numeric:tabular-nums}

.somas{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 17px;margin:20px 0 26px}
.soma{display:flex;justify-content:space-between;gap:12px;color:var(--ink-2);font-size:.93rem;
  padding:4px 0;font-variant-numeric:tabular-nums}
.soma--total{border-top:1px solid var(--line);margin-top:9px;padding-top:14px;color:var(--ink);align-items:baseline}
.soma--total span:first-child{font-size:1rem;font-weight:600}
.soma--total strong{font-family:Fraunces,Georgia,serif;font-size:1.75rem;font-weight:600;color:var(--latao);line-height:1.1}

.cond{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 17px;margin-bottom:22px}
.cond__item{padding:12px 0;border-bottom:1px solid var(--line)}
.cond__item:last-child{border-bottom:0}
.cond__rot{font-size:.75rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin:0 0 3px}
.cond__val{margin:0;font-size:.95rem}

.obs{background:var(--surface-2);border-radius:12px;padding:15px 17px;margin-bottom:26px;
  font-size:.9rem;color:var(--ink-2);white-space:pre-wrap}

.acoes{display:flex;flex-direction:column;gap:10px;margin-bottom:30px}
.bt{display:flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;
  font-size:1rem;font-weight:600;padding:15px 20px;border-radius:11px;transition:opacity .15s}
.bt:active{opacity:.82}
.bt--zap{background:var(--zap);color:#fff}
.bt--pdf{background:var(--surface);color:var(--ink);border:1px solid var(--line)}

.rodape{text-align:center;color:var(--ink-3);font-size:.83rem;line-height:1.7;padding-top:22px;border-top:1px solid var(--line)}
.rodape a{color:var(--latao);text-decoration:none}

.aviso-caixa{max-width:460px;margin:16vh auto;padding:0 20px;text-align:center}
.aviso-caixa h1{font-family:Fraunces,Georgia,serif;font-size:1.3rem;margin:0 0 10px}
.aviso-caixa p{color:var(--ink-2);margin:0 0 18px}
.aviso-caixa a{color:var(--latao)}
.girando{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);
  border-top-color:var(--latao);animation:gira .7s linear infinite;margin:16vh auto}
@keyframes gira{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:560px){.acoes{flex-direction:row}.bt{flex:1}}
</style>
</head>
<body>

<div id="alvo"><div class="girando" aria-label="Carregando"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/sistema/config.js"></script>
<script>
(function () {
  'use strict';

  var CFG = window.CONFIG_ORCAMENTO || {};
  var emp = CFG.empresa || {};
  var alvo = document.getElementById('alvo');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function dinheiro(v) {
    return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  }
  function dataBR(iso) {
    return new Date(iso||Date.now()).toLocaleDateString('pt-BR',
      {day:'2-digit',month:'long',year:'numeric'});
  }
  function validoAte(iso, dias) {
    var d = new Date(iso||Date.now());
    d.setDate(d.getDate() + (Number(dias)||15));
    return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
  }

  function recado(titulo, texto) {
    alvo.innerHTML = '<div class="aviso-caixa"><h1>' + esc(titulo) + '</h1><p>' + texto + '</p>' +
      (emp.whatsapp ? '<a href="https://wa.me/' + esc(emp.whatsapp) + '">Falar com a ' +
       esc(emp.nome || 'marcenaria') + '</a>' : '') + '</div>';
  }

  var id = new URLSearchParams(location.search).get('id');
  if (!id) {
    recado('Link incompleto', 'Este endereço não traz o número do orçamento. Peça o link de novo para quem te enviou.');
    return;
  }

  if (!window.supabase || !CFG.SUPABASE_URL || /COLE_AQUI/.test(CFG.SUPABASE_URL)) {
    recado('Não consegui carregar', 'Tente de novo em alguns instantes.');
    return;
  }

  var sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_CHAVE);

  sb.rpc('orcamento_por_link', { p_id: id }).then(function (r) {
    if (r.error) throw r.error;
    if (!r.data) {
      recado('Orçamento não encontrado',
        'Ele pode ter sido retirado, ou o link veio incompleto. Se precisar, é só pedir um novo.');
      return;
    }
    montar(r.data);
  }).catch(function (e) {
    var m = (e && e.message) || '';
    if (/function .*orcamento_por_link.* does not exist/i.test(m)) {
      recado('Página ainda não configurada', 'Falta rodar o banco-link.sql no Supabase.');
    } else {
      recado('Não consegui carregar', 'Verifique sua conexão e tente de novo.');
    }
  });

  function montar(o) {
    var num = String(o.numero || 0).padStart(3, '0');
    document.title = 'Orçamento ' + num + ' · ' + (emp.nome || 'Marcenaria');

    var itens = Array.isArray(o.itens) ? o.itens : [];
    var subtotal = itens.reduce(function (a, it) {
      return a + (Number(it.qtd)||0) * (Number(it.valor)||0);
    }, 0);
    var desconto = Number(o.desconto) || 0;
    var total = Math.max(0, subtotal - desconto);

    var zap = emp.whatsapp
      ? 'https://wa.me/' + emp.whatsapp + '?text=' +
        encodeURIComponent('Olá! Estou vendo o orçamento nº ' + num + ' e tenho uma dúvida.')
      : null;

    var linkPdf = o.pdf
      ? CFG.SUPABASE_URL + '/storage/v1/object/public/orcamentos/' + o.pdf
      : null;

    var html = '<div class="folha">';

    html += '<header class="topo">' +
      '<h1 class="marca"><picture>' +
        '<source srcset="/assets/img/logo.webp" type="image/webp">' +
        '<img src="/assets/img/logo.png" alt="' + esc(emp.nome || 'Marcenaria') + '" width="520" height="369">' +
      '</picture></h1>' +
      /* a logo já diz "móveis sob medida"; aqui basta a cidade */
      (emp.cidade ? '<p class="marca__sub">' + esc(emp.cidade) + '</p>' : '') +
      '<span class="selo">Orçamento</span>' +
      '<p class="num-grande">Nº ' + num + '</p>' +
      '<p class="data">' + dataBR(o.criado_em) + '</p>' +
    '</header>';

    html += '<section class="para">' +
      '<p class="para__rot">Para</p>' +
      '<p class="para__nome">' + esc(o.cliente_nome || 'Cliente') + '</p>' +
      (o.cliente_endereco ? '<p class="para__dados">' + esc(o.cliente_endereco) + '</p>' : '') +
    '</section>';

    html += '<h2 class="secao">' + (itens.length === 1 ? 'O móvel' : 'Os móveis') + '</h2>';
    html += itens.map(function (it) {
      var qtd = Number(it.qtd)||0, val = Number(it.valor)||0;
      return '<article class="movel">' +
        '<h3 class="movel__nome">' + esc(it.descricao || 'Item') + '</h3>' +
        (it.detalhes ? '<p class="movel__det">' + esc(it.detalhes) + '</p>' : '') +
        '<div class="movel__conta">' +
          '<span class="movel__calc">' + qtd + ' × ' + dinheiro(val) + '</span>' +
          '<strong class="movel__total">' + dinheiro(qtd * val) + '</strong>' +
        '</div></article>';
    }).join('');

    html += '<section class="somas">' +
      (desconto > 0
        ? '<div class="soma"><span>Subtotal</span><span>' + dinheiro(subtotal) + '</span></div>' +
          '<div class="soma"><span>Desconto</span><span>- ' + dinheiro(desconto) + '</span></div>'
        : '') +
      '<div class="soma soma--total"><span>Total</span><strong>' + dinheiro(total) + '</strong></div>' +
    '</section>';

    var cond = [];
    if (o.prazo_entrega) cond.push(['Prazo de entrega', o.prazo_entrega]);
    if (o.forma_pagamento) cond.push(['Forma de pagamento', o.forma_pagamento]);
    cond.push(['Proposta válida até', validoAte(o.criado_em, o.validade_dias)]);

    html += '<h2 class="secao">Condições</h2><section class="cond">' +
      cond.map(function (c) {
        return '<div class="cond__item"><p class="cond__rot">' + esc(c[0]) + '</p>' +
               '<p class="cond__val">' + esc(c[1]) + '</p></div>';
      }).join('') + '</section>';

    if (o.observacoes) html += '<div class="obs">' + esc(o.observacoes) + '</div>';

    html += '<div class="acoes">' +
      (zap ? '<a class="bt bt--zap" href="' + zap + '">Falar sobre o orçamento</a>' : '') +
      (linkPdf ? '<a class="bt bt--pdf" href="' + esc(linkPdf) + '" download>Baixar em PDF</a>' : '') +
    '</div>';

    html += '<footer class="rodape">' + esc(emp.nome || '') +
      (emp.telefone ? '<br>' + esc(emp.telefone) : '') +
      (emp.site ? '<br><a href="https://' + esc(emp.site) + '">' + esc(emp.site) + '</a>' : '') +
      (emp.documento ? '<br>' + esc(emp.documento) : '') +
    '</footer></div>';

    alvo.innerHTML = html;
  }
})();
</script>
</body>
</html>
