<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Agenda · Marcenaria Costa</title>
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/orcamentos/estilo.css">
<link rel="stylesheet" href="/agenda/agenda.css">
</head>
<body>

<!-- ================= LOGIN ================= -->
<section class="entrada" id="tela-login" hidden>
  <form class="entrada__caixa" id="form-login">
    <h1 class="entrada__marca">Marcenaria Costa</h1>
    <p class="entrada__sub">Agenda</p>
    <label class="campo">
      <span class="campo__rot">E-mail</span>
      <input type="email" id="login-email" autocomplete="username" required>
    </label>
    <label class="campo">
      <span class="campo__rot">Senha</span>
      <input type="password" id="login-senha" autocomplete="current-password" required>
    </label>
    <p class="erro" id="login-erro" hidden></p>
    <button class="btn btn--cheio" type="submit" id="login-btn">Entrar</button>
  </form>
</section>

<!-- ================= AGENDA ================= -->
<section class="tela" id="tela-agenda" hidden>
  <header class="topo">
    <div>
      <nav class="abas">
        <a href="/orcamentos">Orçamentos</a>
        <a href="/agenda" aria-current="page">Agenda</a>
      </nav>
      <h1 class="topo__titulo">Agenda</h1>
      <p class="topo__sub" id="agenda-resumo"></p>
    </div>
    <div class="topo__acoes">
      <button class="btn btn--fantasma" type="button" id="btn-sair">Sair</button>
      <button class="btn" type="button" id="btn-nova">Nova visita</button>
    </div>
  </header>

  <section class="proximas" id="proximas" hidden>
    <h2 class="proximas__titulo">A seguir</h2>
    <div id="proximas-lista"></div>
  </section>

  <div class="semana-nav">
    <button class="btn btn--pequeno" type="button" id="btn-semana-ant">← Semana anterior</button>
    <strong id="semana-rotulo"></strong>
    <div class="semana-nav__dir">
      <button class="btn btn--pequeno" type="button" id="btn-hoje">Hoje</button>
      <button class="btn btn--pequeno" type="button" id="btn-semana-prox">Próxima semana →</button>
    </div>
  </div>

  <div id="dias"></div>
</section>

<!-- ================= EDITOR DE VISITA ================= -->
<div class="painel" id="painel" hidden>
  <div class="painel__fundo" data-fechar></div>
  <div class="painel__caixa" role="dialog" aria-modal="true" aria-labelledby="painel-titulo">
    <header class="painel__topo">
      <h2 class="painel__titulo" id="painel-titulo">Nova visita</h2>
      <button class="remover" type="button" data-fechar aria-label="Fechar">✕</button>
    </header>

    <div class="painel__corpo">
      <div class="grade-2">
        <label class="campo">
          <span class="campo__rot">Cliente</span>
          <input type="text" id="v-nome" placeholder="Maria Silva">
        </label>
        <label class="campo">
          <span class="campo__rot">WhatsApp</span>
          <input type="tel" id="v-telefone" placeholder="(41) 99999-9999">
        </label>
      </div>

      <label class="campo">
        <span class="campo__rot">Endereço da visita</span>
        <input type="text" id="v-endereco" placeholder="Rua, número, bairro">
      </label>

      <div class="grade-3">
        <label class="campo">
          <span class="campo__rot">Data</span>
          <input type="date" id="v-data">
        </label>
        <label class="campo">
          <span class="campo__rot">Hora</span>
          <input type="time" id="v-hora" step="900">
        </label>
        <label class="campo">
          <span class="campo__rot">Duração</span>
          <select id="v-duracao">
            <option value="30">30 min</option>
            <option value="60" selected>1 hora</option>
            <option value="90">1h30</option>
            <option value="120">2 horas</option>
            <option value="180">3 horas</option>
          </select>
        </label>
      </div>

      <div class="grade-2">
        <label class="campo">
          <span class="campo__rot">Tipo</span>
          <select id="v-tipo">
            <option value="medicao">Medição</option>
            <option value="apresentacao">Apresentação do projeto</option>
            <option value="montagem">Montagem</option>
            <option value="entrega">Entrega</option>
            <option value="assistencia">Assistência</option>
          </select>
        </label>
        <label class="campo">
          <span class="campo__rot">Situação</span>
          <select id="v-status">
            <option value="agendada">Agendada</option>
            <option value="confirmada">Confirmada pelo cliente</option>
            <option value="realizada">Realizada</option>
            <option value="cancelada">Cancelada</option>
          </select>
        </label>
      </div>

      <label class="campo">
        <span class="campo__rot">Observações</span>
        <textarea id="v-obs" rows="2" placeholder="Apartamento 302, portaria pede documento"></textarea>
      </label>

      <p class="conflito" id="conflito" hidden></p>
    </div>

    <footer class="painel__acoes">
      <button class="btn btn--perigo" type="button" id="btn-excluir-visita" hidden>Excluir</button>
      <div class="painel__acoes-dir">
        <button class="btn btn--fantasma" type="button" id="btn-zap-visita">Confirmar no WhatsApp</button>
        <button class="btn" type="button" id="btn-salvar-visita">Salvar</button>
      </div>
    </footer>
  </div>
</div>

<div class="carregando" id="carregando"><span></span></div>
<div class="aviso-flutuante" id="aviso" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/orcamentos/config.js"></script>
<script src="/agenda/app.js"></script>
</body>
</html>
